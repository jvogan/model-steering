[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-steering-recipes"
version = "0.1.0"
description = "Model steering recipes for Qwen and Muse Glimmer"
requires-python = ">=3.11"
dependencies = [
  "torch==2.14.1",
  "numpy>=1.26",
  "safetensors>=0.5",
]

[project.optional-dependencies]
inference = [
  "transformers==5.20.2",
  "accelerate==1.15.0",
  "sentencepiece>=0.2",
  "protobuf>=5",
]

[tool.setuptools.packages.find]
include = ["steering*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
